name: Problem report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. An error message or a screenshot helps a lot.
      placeholder: For example, tapping Save on the Add a Book page showed "Something went wrong".
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again (optional)
      description: What you did, in order, so the problem can be repeated.
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See the problem
  - type: input
    id: where
    attributes:
      label: Device and browser (optional)
      placeholder: For example, iPhone with Safari, or Mac with Chrome
